name: zhuatech-apistudio
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhuatech_apistudio
      MYSQL_USER: zhuatech
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ZhuaTech-Local-2026!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ZhuaTech-Root-Local-2026!}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["zhuatech_apistudio_mysql:/var/lib/mysql", "./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/zhuatech_apistudio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: zhuatech
      DB_PASSWORD: ${MYSQL_PASSWORD:-ZhuaTech-Local-2026!}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if command -v nc >/dev/null 2>&1; then nc -z 127.0.0.1 8080; else bash -c '</dev/tcp/127.0.0.1/8080'; fi"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro", "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${WEB_PORT:-8088}:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  zhuatech_apistudio_mysql:
