<!doctype html><!-- Copyright 2026 上海如静知华信息科技有限公司 --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华 APIStudio</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1d2733;font:14px "PingFang SC",sans-serif}header{height:64px;background:#17212d;color:#fff;padding:0 5vw;display:flex;align-items:center;gap:18px}header a{margin-left:auto;color:#81b7ff}main{max-width:1180px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.card{background:#fff;border:1px solid #dfe3e8;border-radius:9px;padding:20px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6df;border-radius:6px;margin:6px 0 14px}textarea{height:180px;font-family:monospace}button{background:#1677ff;color:#fff;border:0;border-radius:6px;padding:11px 22px}pre{white-space:pre-wrap;background:#101820;color:#d7e7f5;padding:18px;border-radius:7px;min-height:240px}@media(max-width:760px){main{grid-template-columns:1fr}}</style><header><b>ZhuaTech APIStudio</b><span>API 调试与 Mock</span><a href="https://www.zhuatech.cn/">知华科技</a></header><main><div class="card"><select id="method"><option>GET</option><option>POST</option><option>DELETE</option></select><input id="url" value="http://localhost:8080/api/health"><textarea id="body" placeholder="JSON 请求体"></textarea><button id="run">生成请求计划</button></div><div class="card"><h3>安全预览</h3><pre id="out">等待生成</pre></div></main><script>run.onclick=async()=>{try{const r=await fetch('http://localhost:8081/api/apistudio/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:method.value,url:url.value,body:body.value,timeoutSeconds:10,mockStatus:200,mockDelayMs:80})}).then(x=>x.json());out.textContent=r.riskLevel+' · '+r.riskScore+'\n\n'+r.curlPreview+'\n\n'+r.warnings.join('\n')}catch(e){out.textContent='请先启动后端服务'}};</script>
